name: CI - Tests Automatizados

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        # Quitamos la línea de 'cache' para evitar el error de monorepo

    - name: Instalar dependencias y probar Backend
      run: |
        cd backend
        npm install
        npm run test
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        PORT: 3000

    - name: Instalar dependencias y probar Frontend
      run: |
        cd frontend
        npm install
        npm run test